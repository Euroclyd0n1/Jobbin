name: Check before deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check index.html
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run the checks
        run: node scripts/check-index.mjs
